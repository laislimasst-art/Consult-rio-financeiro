<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6E3F45">
  <title>Meu Consultório</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar" aria-label="Menu principal"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main id="view" class="view"><div class="loading"><div class="spinner"></div><p>Carregando…</p></div></main>
    </div>
    <nav class="bottomnav" id="bottomnav" aria-label="Menu rápido"></nav>
    <button class="fab" id="fab" aria-label="Adicionar novo registro">+</button>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>
  <div id="printArea"></div>

  <!-- Chart.js (CDN) — usado apenas na tela "Evolução" -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <!-- Núcleo: dados e interface base -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/store.js"></script>
  <!-- Serviços (regras de negócio) — ordem não importa entre si, mas ficam antes da UI -->
  <script src="js/services/patients.js"></script>
  <script src="js/services/payments.js"></script>
  <script src="js/services/sessions.js"></script>
  <script src="js/services/expenses.js"></script>
  <script src="js/services/products.js"></script>
  <script src="js/services/crm.js"></script>
  <script src="js/services/growth.js"></script>
  <script src="js/services/finance.js"></script>
  <script src="js/services/backup.js"></script>
  <script src="js/core/ui.js"></script>
  <!-- Telas -->
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/patients.js"></script>
  <script src="js/views/payments.js"></script>
  <script src="js/views/sessions.js"></script>
  <script src="js/views/agenda.js"></script>
  <script src="js/views/receipts.js"></script>
  <script src="js/views/finance.js"></script>
  <script src="js/views/expenses.js"></script>
  <script src="js/views/products.js"></script>
  <script src="js/views/crm.js"></script>
  <script src="js/views/growth.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/search.js"></script>
  <script src="js/app.js"></script>

</html>
