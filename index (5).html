<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6E3F45">
  <title>Meu Consultório</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
/* Meu Consultório — identidade: off-white, rosé, vinho. */
:root{
  --bg:#F7F3F1; --rose-l:#E8D2D2; --rose:#C98F94; --burnt:#B26D70; --wine:#6E3F45; --gray:#5D5555; --white:#FFFFFF;
  --line:#EBDFDD; --soft:#FBF8F7; --ok-bg:#E6EEE7; --ok:#3E6A4B; --warn-bg:#F7EAD9; --warn:#8A5A1F; --bad-bg:#F5DADA; --bad:#8E2F36;
  --shadow:0 8px 28px rgba(110,63,69,.07); --shadow-lg:0 20px 50px rgba(80,40,46,.22);
  --r:18px; --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--gray);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);color:var(--wine);margin:0;font-weight:600;letter-spacing:.2px}
h1{font-size:2.15rem;line-height:1.1} h3{font-size:1.4rem} h4{font-size:1.15rem}
a{color:var(--burnt)} button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--burnt);outline-offset:2px}
.ic{flex:none;vertical-align:middle}
[hidden]{display:none!important}

/* Layout */
#app{display:flex;min-height:100vh}
.sidebar{width:256px;flex:none;background:var(--white);border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:26px 16px 18px;overflow-y:auto;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 24px}
.brand-mark{width:42px;height:42px;border-radius:14px;background:var(--wine);display:grid;place-items:center;overflow:hidden;flex:none}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand-mark span{font-family:var(--serif);font-size:1.5rem;color:var(--rose-l);line-height:1}
.brand-name{font-family:var(--serif);font-size:1.35rem;color:var(--wine);line-height:1.05;font-weight:600}
.brand-name small{display:block;font:500 .72rem var(--sans);color:var(--rose);letter-spacing:.3px;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--gray);text-decoration:none;font-weight:500;transition:background .18s,color .18s}
.nav a:hover{background:var(--soft);color:var(--wine)}
.nav a.on{background:var(--rose-l);color:var(--wine)}
.side-foot{margin-top:auto;padding:18px 10px 0;font-size:.74rem;color:#8d8282;line-height:1.45}
.main{flex:1;margin-left:256px;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:14px;padding:14px 32px;background:rgba(247,243,241,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-title{font-family:var(--serif);font-size:1.3rem;color:var(--wine);display:none}
.search-box{position:relative;flex:1;max-width:520px}
.search-box .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--rose)}
.search-box input{width:100%;height:44px;padding:0 14px 0 42px;border:1px solid var(--line);border-radius:14px;background:var(--white);font:inherit;color:var(--gray)}
.search-box input:focus{border-color:var(--rose);outline:none;box-shadow:0 0 0 4px rgba(201,143,148,.18)}
.search-results{position:absolute;top:52px;left:0;right:0;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);max-height:70vh;overflow:auto;padding:8px;z-index:30}
.search-results h5{margin:10px 10px 4px;font:600 .72rem var(--sans);color:var(--rose);letter-spacing:.3px}
.search-results button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:10px;color:var(--gray)}
.search-results button:hover{background:var(--soft)} .search-results small{display:block;color:#8d8282}
#topAdd{margin-left:auto}
#searchToggle{display:none}
.view{padding:30px 32px 80px;max-width:1240px;width:100%;margin:0 auto}
.loading{display:grid;place-items:center;padding:90px 0;color:var(--rose)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--rose-l);border-top-color:var(--burnt);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Cabeçalhos e cartões */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.page-head .sub{margin:6px 0 0;color:#7c7171}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.card+.card,.section{margin-top:20px}
.card h3{margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head h3{margin:0}
.grid{display:grid;gap:18px}
.g-stats{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.stat{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.stat:hover{border-color:var(--rose)}
.stat-l{font-size:.82rem;color:#7c7171;font-weight:500}
.stat-v{font-family:var(--serif);font-size:2rem;line-height:1.1;color:var(--wine);font-weight:600}
.stat-s{font-size:.78rem;color:#8d8282}
.stat.hero{background:var(--wine);border-color:var(--wine)} .stat.hero .stat-l,.stat.hero .stat-s{color:var(--rose-l)} .stat.hero .stat-v{color:var(--white)}
.stat.neg .stat-v{color:var(--bad)}
.delta{font-size:.76rem;font-weight:600;margin-top:2px}.delta.good{color:var(--ok)}.delta.bad{color:var(--bad)}
.hero-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:24px}
.hero-head h1{font-size:2.5rem}
.hello{font-family:var(--serif);font-size:1.35rem;color:var(--burnt);margin:4px 0 0}
.month-nav{display:inline-flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:4px}
.month-nav strong{min-width:150px;text-align:center;color:var(--wine);font-weight:600}
.alerts{display:grid;gap:10px;margin-bottom:22px}
.alert{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--rose-l);border-left:4px solid var(--burnt);border-radius:14px;padding:12px 16px;text-align:left;width:100%;color:var(--gray)}
.alert .ic{color:var(--burnt)} .alert:hover{background:var(--soft)}
.alert.info{border-left-color:var(--rose)}
.notice{background:var(--soft);border:1px dashed var(--rose);border-radius:14px;padding:12px 14px;font-size:.84rem;color:var(--wine)}
.notice.big{margin-top:24px}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}.list-row small{display:block;color:#8d8282}
.list-row strong{color:var(--wine);font-weight:600}
.progress{height:10px;background:var(--rose-l);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--burnt));border-radius:99px;transition:width .5s}
.prog-line{display:flex;justify-content:space-between;font-size:.84rem;margin-bottom:6px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 18px;font-weight:600;line-height:1.2;transition:background .18s,transform .12s,box-shadow .18s;text-decoration:none;min-height:42px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--wine);color:var(--white)} .btn.primary:hover{background:var(--burnt)}
.btn.soft{background:var(--rose-l);color:var(--wine)} .btn.soft:hover{background:#dfc2c3}
.btn.ghost{background:transparent;color:var(--gray);border-color:var(--line)} .btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--white);color:var(--bad);border-color:#e8c4c6} .btn.danger:hover{background:var(--bad-bg)}
.btn.danger-solid{background:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.84rem;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{width:38px;height:38px;border-radius:11px;border:0;background:transparent;color:var(--gray);display:inline-grid;place-items:center;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--rose-l);color:var(--wine)} .icon-btn.danger:hover{background:var(--bad-bg);color:var(--bad)}
.row-actions{display:flex;gap:2px;justify-content:flex-end;flex-wrap:wrap}

/* Badges, tabs */
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.76rem;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.rose{background:var(--rose-l);color:var(--wine)}.badge.neutral{background:#EFE9E7;color:var(--gray)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--white);color:var(--gray);padding:9px 16px;border-radius:99px;font-weight:500;white-space:nowrap;transition:all .18s}
.tab em{font-style:normal;font-size:.76rem;background:var(--soft);border-radius:99px;padding:1px 8px;margin-left:4px}
.tab.on{background:var(--wine);border-color:var(--wine);color:#fff}.tab.on em{background:rgba(255,255,255,.2);color:#fff}

/* Filtros e tabelas */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px;font-size:.76rem;color:#7c7171;min-width:130px}
.f select,.f input{height:42px;border:1px solid var(--line);border-radius:12px;background:var(--white);padding:0 12px;font:inherit;color:var(--gray)}
.f.search{position:relative;flex:1;min-width:200px}.f.search .ic{position:absolute;left:12px;bottom:12px;color:var(--rose)}.f.search input{padding-left:38px}
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:.78rem;font-weight:600;color:#8d8282;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover{background:var(--soft)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}.tbl .act{text-align:right;width:1%;white-space:nowrap}
.tbl strong{color:var(--wine)}
.sum-strip{display:flex;gap:22px;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:.88rem}
.sum-strip b{color:var(--wine);font-weight:600}
.empty{text-align:center;padding:38px 18px;color:#8d8282}
.empty-ic{width:62px;height:62px;border-radius:50%;background:var(--rose-l);color:var(--wine);display:grid;place-items:center;margin:0 auto 14px}
.empty h4{margin-bottom:6px}.empty p{margin:0 auto 16px;max-width:380px}

/* Pacientes */
.pcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;transition:border-color .2s,transform .2s;color:var(--gray)}
.pcard:hover{border-color:var(--rose);transform:translateY(-2px)}
.pcard h4{font-size:1.45rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pcard p{margin:3px 0;font-size:.88rem}
.pcard .pend{color:var(--bad);font-weight:600}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px 22px}
.info-grid dt{font-size:.76rem;color:#8d8282;margin-bottom:2px}.info-grid dd{margin:0;color:var(--wine);font-weight:500}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--burnt);text-decoration:none;font-weight:500;margin-bottom:12px;background:none;border:0;padding:0}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:14px}
.slot{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--soft);text-align:left;color:var(--gray);transition:border-color .18s}
.slot:hover{border-color:var(--rose)} .slot h5{margin:0 0 6px;font:600 .95rem var(--sans);color:var(--wine);display:flex;justify-content:space-between}
.slot p{margin:2px 0;font-size:.84rem}
.slot.done{background:var(--ok-bg);border-color:#cfe0d2}
.pkg-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Agenda */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:.76rem;font-weight:600;color:#8d8282;padding:6px 0}
.day{min-height:96px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--gray);transition:border-color .15s}
.day:hover{border-color:var(--rose)} .day.empty{background:transparent;border-color:transparent;cursor:default}
.day .n{font-weight:600;color:var(--wine);font-size:.9rem}
.day.today .n{background:var(--wine);color:#fff;border-radius:99px;width:26px;height:26px;display:grid;place-items:center}
.day.sel{border-color:var(--burnt);box-shadow:0 0 0 3px rgba(201,143,148,.25)}
.chip{font-size:.7rem;line-height:1.25;padding:2px 6px;border-radius:6px;background:var(--soft);border-left:3px solid var(--c,var(--rose));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chips em{font-size:.7rem;color:#8d8282;font-style:normal}
.dots{display:none;gap:3px;flex-wrap:wrap}.dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--rose));display:inline-block}
.agenda-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;color:var(--gray)}
.agenda-item:hover{border-color:var(--rose)}.agenda-item .dot{width:10px;height:10px;flex:none}.agenda-item small{display:block;color:#8d8282}
.agenda-item.cancelled strong{text-decoration:line-through;opacity:.6}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;margin-top:14px}.legend span{display:inline-flex;gap:6px;align-items:center}

/* Linha do tempo, metas */
.timeline{position:relative;padding-left:26px}
.timeline:before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--rose-l)}
.t-item{position:relative;margin-bottom:20px}
.t-item:before{content:'';position:absolute;left:-26px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--white);border:3px solid var(--burnt)}
.t-item .card{padding:18px}.t-item img{max-width:100%;max-height:260px;border-radius:14px;margin-top:10px;display:block}
.t-date{font-size:.8rem;color:var(--burnt);font-weight:600;margin-bottom:4px}
.goal h4{margin-bottom:8px}.chart-box{position:relative;height:270px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.link-out{display:inline-flex;gap:4px;align-items:center;font-size:.84rem}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(60,35,38,.38);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;transition:opacity .16s;z-index:100}
.modal-backdrop.show{opacity:1}
.modal{background:var(--white);border-radius:22px;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);transform:translateY(10px) scale(.98);transition:transform .2s}
.modal.wide{width:min(760px,100%)}.show .modal{transform:none}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 8px}
.modal-body{padding:8px 24px 18px;overflow-y:auto}
.modal-foot{display:flex;gap:10px;align-items:center;padding:14px 24px 20px;border-top:1px solid var(--line)}
.spacer{flex:1}
.confirm-msg{margin:6px 0;line-height:1.6}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.span2{grid-column:1/-1}
.form-section{grid-column:1/-1;margin-top:8px;padding-top:12px;border-top:1px solid var(--line);font-size:1.15rem}
.form-section:first-child{border:0;margin-top:0;padding-top:0}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--wine);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 13px;font:inherit;color:var(--gray);background:var(--white)}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rose);outline:none;box-shadow:0 0 0 4px rgba(201,143,148,.18)}
.field small{display:block;margin-top:4px;font-size:.74rem;color:#8d8282}
.req{color:var(--burnt)}
.check{display:flex!important;align-items:center;gap:10px;font-weight:500!important;color:var(--gray)!important;cursor:pointer;min-height:40px}
.check input{width:20px!important;height:20px;min-height:0!important;accent-color:var(--wine)}
.form-error{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:.88rem}
.img-field{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.img-prev{width:84px;height:84px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.img-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.img-actions input{min-height:0;border:0;padding:0;width:auto}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:16px;border:1px solid var(--line);background:var(--soft);color:var(--wine);font-weight:600;font-size:.86rem}
.quick:hover{background:var(--rose-l)}

/* Toast */
#toastRoot{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;width:min(92vw,420px);pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:var(--wine);color:#fff;padding:13px 18px;border-radius:14px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(10px);transition:all .25s}
.toast.show{opacity:1;transform:none}.toast.err{background:var(--bad)}

/* Recibo e impressão */
#printArea{display:none}
.receipt{max-width:720px;margin:0 auto;padding:32px;border:1px solid var(--rose-l);border-radius:8px;color:#333;font-family:var(--sans);background:#fff}
.receipt header{display:flex;gap:16px;align-items:center;border-bottom:2px solid var(--wine);padding-bottom:16px;margin-bottom:22px}
.receipt .r-logo{width:64px;height:64px;object-fit:contain}.receipt h1{font-size:1.7rem}.receipt header p{margin:2px 0;font-size:.86rem}
.receipt h2{font-size:1.4rem;display:flex;justify-content:space-between;margin-bottom:12px}
.receipt .r-val{font-family:var(--serif);font-size:2.2rem;color:var(--wine);margin:6px 0 18px}
.receipt p{line-height:1.7}.receipt .sign{margin:56px auto 8px;width:280px;text-align:center;border-top:1px solid #555;padding-top:6px;font-size:.88rem}
.receipt footer{margin-top:28px;font-size:.76rem;color:#777;text-align:center}
.report h1{margin-bottom:4px}.report h3{margin:22px 0 10px}
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  body.printing{background:#fff}
  .receipt{border:0;padding:0}
  @page{margin:16mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
a.quick{text-decoration:none}

</style>
  <style>
/* Experiência mobile: menu inferior, cards empilhados, botão flutuante */
.bottomnav,.fab{display:none}
@media (max-width:1100px){.g-2{grid-template-columns:1fr}}
@media (max-width:900px){
  .sidebar{display:none}
  .main{margin-left:0}
  .topbar{padding:10px 16px;gap:10px}
  .top-title{display:block;flex:1}
  .search-box{display:none;position:absolute;left:12px;right:12px;top:58px;max-width:none}

  <script>
/* Utilidades gerais (sem dependência de interface ou de armazenamento) */
(function () {
  'use strict';
  const CP = (window.CP = window.CP || {});
  CP.views = CP.views || {};
  CP.actions = CP.actions || {};
  const U = (CP.U = {});
  const pad = (n) => String(n).padStart(2, '0');

  U.MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  U.WEEKDAYS = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];

  U.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  U.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.money = (n) => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  U.norm = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  U.today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  U.thisMonth = () => U.today().slice(0, 7);
  U.monthKey = (d) => (d ? String(d).slice(0, 7) : '');
  U.yearOf = (d) => (d ? String(d).slice(0, 4) : '');
  U.fmtDate = (d) => (d && /^\d{4}-\d{2}-\d{2}/.test(d) ? `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}` : '—');
  U.monthLabel = (k) => (k ? `${U.MONTHS[parseInt(k.slice(5, 7), 10) - 1]} de ${k.slice(0, 4)}` : '');
  U.monthShort = (k) => U.MONTHS[parseInt(k.slice(5, 7), 10) - 1].slice(0, 3);
  U.addMonths = (k, n) => {
    let y = +k.slice(0, 4), m = +k.slice(5, 7) - 1 + n;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return `${y}-${pad(m + 1)}`;
  };
  U.daysInMonth = (k) => new Date(+k.slice(0, 4), +k.slice(5, 7), 0).getDate();
  U.sum = (arr, fn) => arr.reduce((s, x) => s + (Number(fn ? fn(x) : x) || 0), 0);
  U.sortBy = (arr, fn, dir = 1) => arr.slice().sort((a, b) => { const x = fn(a), y = fn(b); return x < y ? -dir : x > y ? dir : 0; });
  U.debounce = (fn, ms = 150) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  U.pad = pad;

  U.download = (name, text, mime = 'application/json') => {
    const blob = new Blob([text], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  U.readText = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(file); });
  U.resizeImage = (file, max = 900, type = 'image/jpeg', quality = 0.82) => new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(r.error);
    r.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Não foi possível ler esta imagem.'));
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL(type, quality));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });

  /* Interpreta buscas por data: 17/08/2026, 2026-08-17, 08/2026 */
  U.parseDateQuery = (q) => {
    q = String(q || '').trim();
    let m;
    if ((m = q.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return { type: 'day', value: `${m[3]}-${pad(m[2])}-${pad(m[1])}` };
    if ((m = q.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return { type: 'day', value: q };
    if ((m = q.match(/^(\d{1,2})\/(\d{4})$/))) return { type: 'month', value: `${m[2]}-${pad(m[1])}` };
    if ((m = q.match(/^(\d{4})-(\d{2})$/))) return { type: 'month', value: q };
    return null;
  };

  /* Valor por extenso (R$) */
  const UN = ['zero', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
  const DZ = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
  const CT = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
  const ate999 = (n) => {
    if (n === 0) return '';
    if (n === 100) return 'cem';
    const c = Math.floor(n / 100), r = n % 100, parts = [];
    if (c) parts.push(CT[c]);
    if (r) { if (r < 20) parts.push(UN[r]); else { const d = Math.floor(r / 10), u = r % 10; parts.push(DZ[d] + (u ? ' e ' + UN[u] : '')); } }
    return parts.join(' e ');
  };
  const inteiro = (n) => {
    if (n === 0) return 'zero';
    const mil = Math.floor(n / 1000), resto = n % 1000;
    let out = '';
    if (mil) out += mil === 1 ? 'mil' : ate999(mil) + ' mil';
    if (resto) out += (mil ? (resto < 100 || resto % 100 === 0 ? ' e ' : ' ') : '') + ate999(resto);
    return out;
  };
  U.extenso = (valor) => {
    const v = Math.round((Number(valor) || 0) * 100);
    const reais = Math.floor(v / 100), cent = v % 100;
    if (reais >= 1000000) return '';
    const parts = [];
    if (reais > 0 || cent === 0) parts.push(inteiro(reais) + (reais === 1 ? ' real' : ' reais'));
    if (cent > 0) parts.push(inteiro(cent) + (cent === 1 ? ' centavo' : ' centavos'));
    return parts.join(' e ');
  };
})();

  <script>
/*
 * CAMADA DE DADOS (única que conhece IndexedDB/localStorage).
 * A interface NUNCA acessa o navegador diretamente: UI → Services → Storage.
 *
 * FASE 2: para migrar ao Supabase, reescreva os métodos deste arquivo
 * (getPatients, savePatient, deletePatient, getPayments, ...) mantendo
 * os mesmos nomes e retornos (Promises). Veja o README.
 */
(function () {
  'use strict';
  const CP = (window.CP = window.CP || {});

  // store → [nome plural, nome singular] usados nos métodos getX / saveX / deleteX
  const ENTITIES = {
    patients: ['Patients', 'Patient'],
    payments: ['Payments', 'Payment'],
    sessions: ['Sessions', 'Session'],
    expenses: ['Expenses', 'Expense'],
    fixedExpenses: ['FixedExpenses', 'FixedExpense'],
    products: ['Products', 'Product'],
    sales: ['Sales', 'Sale'],
    leads: ['Leads', 'Lead'],
    followups: ['Followups', 'Followup'],
    goals: ['Goals', 'Goal'],
    achievements: ['Achievements', 'Achievement'],
    events: ['Events', 'Event'],
    receipts: ['Receipts', 'Receipt'],
  };
  const STORES = Object.keys(ENTITIES);
  const DB_NAME = 'consultorio-psi';
  const DB_VERSION = 1;
  const FALLBACK_KEY = 'cp_fallback_data';
  const SETTINGS_KEY = 'cp_settings';

  let db = null;
  let mode = 'indexeddb';
  let mem = {};

  /* ---------- Driver IndexedDB ---------- */
  const idb = {
    open() {
      return new Promise((res, rej) => {
        if (!window.indexedDB) return rej(new Error('IndexedDB indisponível'));
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          STORES.forEach((s) => { if (!req.result.objectStoreNames.contains(s)) req.result.createObjectStore(s, { keyPath: 'id' }); });
        };
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
        req.onblocked = () => rej(new Error('IndexedDB bloqueado'));
      });
    },
    getAll: (s) => new Promise((res, rej) => { const r = db.transaction(s).objectStore(s).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }),
    put: (s, rec) => new Promise((res, rej) => { const t = db.transaction(s, 'readwrite'); t.objectStore(s).put(rec); t.oncomplete = () => res(rec); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }),
    remove: (s, id) => new Promise((res, rej) => { const t = db.transaction(s, 'readwrite'); t.objectStore(s).delete(id); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }),
    replaceAll: (data) => new Promise((res, rej) => {
      const t = db.transaction(STORES, 'readwrite');
      STORES.forEach((s) => { const os = t.objectStore(s); os.clear(); (data[s] || []).forEach((r) => os.put(r)); });
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }),
  };

  /* ---------- Driver localStorage (plano B se IndexedDB falhar) ---------- */
  const ls = {
    load() { try { mem = JSON.parse(localStorage.getItem(FALLBACK_KEY)) || {}; } catch (e) { mem = {}; } STORES.forEach((s) => { mem[s] = mem[s] || []; }); },
    persist() { localStorage.setItem(FALLBACK_KEY, JSON.stringify(mem)); },
    async getAll(s) { return mem[s].slice(); },
    async put(s, rec) { const i = mem[s].findIndex((x) => x.id === rec.id); if (i >= 0) mem[s][i] = rec; else mem[s].push(rec); ls.persist(); return rec; },
    async remove(s, id) { mem[s] = mem[s].filter((x) => x.id !== id); ls.persist(); },
    async replaceAll(data) { STORES.forEach((s) => { mem[s] = (data[s] || []).slice(); }); ls.persist(); },
  };
  const driver = () => (mode === 'indexeddb' ? idb : ls);

  const storage = (CP.storage = {
    STORES, ENTITIES,
    async init() {
      try { db = await idb.open(); mode = 'indexeddb'; }
      catch (e) { console.warn('IndexedDB indisponível, usando localStorage.', e); mode = 'localStorage'; ls.load(); }
      return mode;
    },
    get mode() { return mode; },
    getAll: (s) => driver().getAll(s),
    put: (s, rec) => driver().put(s, rec),
    remove: (s, id) => driver().remove(s, id),
    replaceAll: (data) => driver().replaceAll(data),
    clearAll() { const empty = {}; STORES.forEach((s) => { empty[s] = []; }); return driver().replaceAll(empty); },
    async exportAll() { const data = {}; for (const s of STORES) data[s] = await driver().getAll(s); return data; },

    /* Configurações simples ficam no localStorage */
    getSettings() { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch (e) { return {}; } },
    saveSettings(obj) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(obj)); },
  });

  // Métodos nomeados (formato pedido): getPatients / savePatient / deletePatient, getPayments ...
  Object.entries(ENTITIES).forEach(([store, [plural, singular]]) => {
    storage['get' + plural] = () => storage.getAll(store);
    storage['save' + singular] = (rec) => storage.put(store, rec);
    storage['delete' + singular] = (id) => storage.remove(store, id);
  });
})();

</script>
  <script>
/*
 * Cache em memória + fábrica de serviços.
 * Os serviços leem do cache (rápido, síncrono para a interface) e gravam
 * pela camada storage (assíncrona). Na Fase 2 o cache continua igual;
 * só o storage.js muda.
 */
(function () {
  'use strict';
  const CP = window.CP, S = CP.storage;
  const cache = {};
  S.STORES.forEach((s) => { cache[s] = []; });

  CP.db = {
    async load() { for (const s of S.STORES) cache[s] = await S.getAll(s); },
    reset(data) { S.STORES.forEach((s) => { cache[s] = (data && data[s]) || []; }); },
  };

  CP.makeService = function (store) {
    const singular = S.ENTITIES[store][1];
    return {
      store,
      all: () => cache[store],
      get: (id) => cache[store].find((x) => x.id === id),
      async save(rec) {
        const now = new Date().toISOString();
        const out = { ...rec };
        if (!out.id) { out.id = CP.U.uid(); out.createdAt = now; }
        out.updatedAt = now;
        await S['save' + singular](out);
        const i = cache[store].findIndex((x) => x.id === out.id);
        if (i >= 0) cache[store][i] = out; else cache[store].push(out);
        return out;
      },
      async remove(id) {
        await S['delete' + singular](id);
        cache[store] = cache[store].filter((x) => x.id !== id);
      },
    };
  };

  /* Configurações (localStorage) */
  CP.settings = {
    DEFAULTS: {
      name: 'Laís Rodrigues', profession: 'Psicóloga', crp: '05/63116',
      phone: '', email: '', pix: '', cpf: '', address: '', receiptNote: '', logo: '',
      monthlyGoal: 0, lastBackup: '', seeded: false,
      expenseCategories: ['plataformas', 'internet', 'energia', 'marketing', 'cursos', 'supervisão', 'materiais', 'hospedagem', 'domínio', 'outros'],
    },
    data: {},
    load() { this.data = { ...this.DEFAULTS, ...S.getSettings() }; },
    get(k) { return this.data[k]; },
    save(partial) { const next = { ...this.data, ...partial }; S.saveSettings(next); this.data = next; },
    replace(obj) { const next = { ...this.DEFAULTS, ...obj }; S.saveSettings(next); this.data = next; },
  };
})();

  ];

  /* Indicadores derivados (nada é inventado: só o que foi registrado) */
  P.stats = (id, month) => {

    const paid = pays.filter((x) => x.status === 'pago');
    const pend = pays.filter((x) => x.status === 'pendente' || x.status === 'parcial');
    const sess = CP.sessions.all().filter((x) => x.patientId === id);
    const done = sess.filter((s) => s.status === 'realizada').map((s) => s.date).sort();

    const p = P.get(id) || {};
    return {
      lastSession: done.pop() || '',
      nextSession: fut[0] || '',
      lastPayment: lastPay,
      nextPayment: pendDates[0] || p.nextPaymentDate || '',
      receivedMonth: U.sum(paid.filter((x) => U.monthKey(x.date) === month), (x) => x.value),
      pendingValue: U.sum(pend, (x) => x.value),
      pendingCount: pend.length,
    };
  };

  /* Pacientes iniciais — SOMENTE os dados informados. Horários, dias e pagamentos ficam vazios. */
  P.seedData = () => [

  ];
  P.seed = async () => { for (const d of P.seedData()) await P.save(d); };
})();

  <script>
/*
 * Regras financeiras (todas reais, nada inventado):
 *  - Receita recebida  = SOMENTE pagamentos com status "pago" (+ vendas pagas).
 *  - Receita prevista  = valores esperados das pacientes/pacotes no mês (+ produtos já lançados).
 *  - A receber         = prevista − recebida (nunca negativo).
 *  - Lucro             = recebida − despesas com status "pago".
 */
(function () {
  'use strict';
  const CP = window.CP, U = CP.U;
  const F = (CP.finance = {});

  /* Valor esperado de uma paciente no mês */
  F.expectedForPatient = (p, m) => {
    const live = ['ativa', 'nova'].includes(p.status) || (p.exitDate && U.monthKey(p.exitDate) >= m);
    if (!live) return 0;
    let exp = 0;
    const started = !p.startDate || U.monthKey(p.startDate) <= m;
    const exited = p.exitDate && U.monthKey(p.exitDate) < m;
    if (started && !exited) {
      if (p.paymentModel === 'pacote_mensal') exp += (Number(p.packageSize) || 0) * (Number(p.sessionValue) || 0);
      else {
        // semanal/quinzenal/por sessão: só conta sessões já agendadas/realizadas na agenda
        const n = CP.sessions.all().filter((s) => s.patientId === p.id && U.monthKey(s.date) === m && ['agendada', 'realizada'].includes(s.status)).length;
        exp += n * (Number(p.sessionValue) || 0);
      }
    }
    if (p.evaluationDate && U.monthKey(p.evaluationDate) === m) exp += Number(p.evaluationValue) || 0;
    return exp;
  };

  F.monthSummary = (m) => {
    const pays = CP.payments.all().filter((x) => U.monthKey(x.date) === m);
    const paid = pays.filter((x) => x.status === 'pago');
    const pend = pays.filter((x) => x.status === 'pendente' || x.status === 'parcial');
    const sales = CP.sales.all().filter((x) => U.monthKey(x.date) === m);
    const salesPaid = sales.filter((x) => x.status === 'pago');
    const salesPend = sales.filter((x) => x.status === 'pendente');
    const patPaid = paid.filter((x) => x.refType !== 'produto');
    const prodPaidPay = paid.filter((x) => x.refType === 'produto');
    const patientRevenue = U.sum(patPaid, (x) => x.value);
    const productRevenue = U.sum(salesPaid, (x) => x.value) + U.sum(prodPaidPay, (x) => x.value);
    const received = patientRevenue + productRevenue;

    // Previsto por paciente
    const perPatient = [];
    let expectedPatients = 0;
    CP.patients.all().forEach((p) => {
      const paidP = U.sum(patPaid.filter((x) => x.patientId === p.id), (x) => x.value);
      const pendP = U.sum(pend.filter((x) => x.patientId === p.id && x.refType !== 'produto'), (x) => x.value);
      const exp = Math.max(F.expectedForPatient(p, m), paidP + pendP);
      if (exp > 0 || paidP > 0) perPatient.push({ id: p.id, name: p.name, expected: exp, paid: paidP, pending: Math.max(0, exp - paidP) });
      expectedPatients += exp;
    });
    const knownIds = new Set(CP.patients.all().map((p) => p.id));
    const orphanPaid = U.sum(patPaid.filter((x) => !knownIds.has(x.patientId)), (x) => x.value);
    const orphanPend = U.sum(pend.filter((x) => !knownIds.has(x.patientId) && x.refType !== 'produto'), (x) => x.value);
    if (orphanPaid + orphanPend > 0) { perPatient.push({ id: '', name: 'Sem paciente cadastrada', expected: orphanPaid + orphanPend, paid: orphanPaid, pending: orphanPend }); expectedPatients += orphanPaid + orphanPend; }

    const productPending = U.sum(salesPend, (x) => x.value) + U.sum(pend.filter((x) => x.refType === 'produto'), (x) => x.value);
    const expected = expectedPatients + productRevenue + productPending;
    const toReceive = Math.max(0, expected - received);

    const exps = CP.expenses.all().filter((x) => U.monthKey(x.date) === m);
    const expensesPaid = U.sum(exps.filter((x) => x.status === 'pago'), (x) => x.value);
    const expensesPending = U.sum(exps.filter((x) => x.status === 'pendente'), (x) => x.value);

    const done = CP.sessions.all().filter((s) => s.status === 'realizada' && U.monthKey(s.date) === m);
    const served = new Set([...done.map((s) => s.patientId), ...patPaid.map((x) => x.patientId)].filter(Boolean));
    const payers = new Set(patPaid.map((x) => x.patientId).filter(Boolean));
    const payerRevenue = U.sum(patPaid.filter((x) => x.patientId), (x) => x.value);

    // Receita por produto
    const byProduct = {};
    salesPaid.forEach((s) => { const k = s.productId || '_'; byProduct[k] = byProduct[k] || { name: (CP.products.get(s.productId) || {}).name || 'Produto removido', qty: 0, revenue: 0 }; byProduct[k].qty++; byProduct[k].revenue += Number(s.value) || 0; });
    if (prodPaidPay.length) byProduct._pay = { name: 'Pagamentos “referente a produto”', qty: prodPaidPay.length, revenue: U.sum(prodPaidPay, (x) => x.value) };

    // Despesas por categoria
    const byCategory = {};
    exps.filter((x) => x.status === 'pago').forEach((x) => { byCategory[x.category || 'outros'] = (byCategory[x.category || 'outros'] || 0) + (Number(x.value) || 0); });

    return {
      month: m, received, patientRevenue, productRevenue, expected, toReceive,
      expensesPaid, expensesPending, profit: received - expensesPaid,
      sessionsDone: done.length, servedCount: served.size,
      ticket: payers.size ? payerRevenue / payers.size : null,
      perPatient: U.sortBy(perPatient, (x) => x.paid, -1),
      byProduct: Object.values(byProduct), byCategory,
      pendingPayments: pend, receiptsPending: paid.filter((x) => !x.receiptIssued), carnePending: paid.filter((x) => !x.carneLeao),
      newPatients: CP.patients.all().filter((p) => U.monthKey(p.startDate) === m).length,
      exits: CP.patients.all().filter((p) => U.monthKey(p.exitDate) === m).length,
      newLeads: CP.leads.all().filter((l) => (l.firstContact ? U.monthKey(l.firstContact) : U.monthKey(l.createdAt)) === m).length,
      hasData: received > 0 || expensesPaid > 0 || done.length > 0 || expected > 0,
    };
  };

  F.yearSummary = (year) => {
    const months = [];
    for (let i = 1; i <= 12; i++) months.push(F.monthSummary(`${year}-${U.pad(i)}`));
    const revenue = U.sum(months, (x) => x.received);
    const expenses = U.sum(months, (x) => x.expensesPaid);
    const active = months.filter((x) => x.received > 0 || x.expensesPaid > 0);
    const withRev = months.filter((x) => x.received > 0);
    const best = withRev.length ? withRev.reduce((a, b) => (b.received > a.received ? b : a)) : null;
    const worst = withRev.length > 1 ? withRev.reduce((a, b) => (b.received < a.received ? b : a)) : null;
    const served = new Set();
    CP.sessions.all().filter((s) => s.status === 'realizada' && U.yearOf(s.date) === year).forEach((s) => s.patientId && served.add(s.patientId));
    CP.payments.all().filter((p) => p.status === 'pago' && p.refType !== 'produto' && U.yearOf(p.date) === year).forEach((p) => p.patientId && served.add(p.patientId));
    const salesPaid = CP.sales.all().filter((s) => s.status === 'pago' && U.yearOf(s.date) === year);
    return {
      year, months, revenue, expenses, profit: revenue - expenses,
      avg: active.length ? revenue / active.length : null, activeMonths: active.length, best, worst,
      served: served.size,
      sessions: U.sum(months, (x) => x.sessionsDone),
      evaluations: CP.patients.all().filter((p) => U.yearOf(p.evaluationDate) === year).length,
      salesCount: salesPaid.length, salesRevenue: U.sum(salesPaid, (s) => s.value),
    };
  };
})();

</script>

/* Backup em JSON: exportar, validar, importar e limpar */
(function () {
  'use strict';
  const CP = window.CP;
  const B = (CP.backup = {});
  B.APP = 'consultorio-psi';
  B.VERSION = 1;

  B.export = async () => ({
    app: B.APP, version: B.VERSION, exportedAt: new Date().toISOString(),
    settings: CP.settings.data, data: await CP.storage.exportAll(),
  });

  B.validate = (obj) => {
    const errors = [];
    const counts = {};
    let total = 0;
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { ok: false, errors: ['O arquivo não tem o formato esperado.'], counts, total };
    if (obj.app !== B.APP) errors.push('Este arquivo não parece ser um backup deste sistema.');
    if (!obj.data || typeof obj.data !== 'object') errors.push('O backup não contém a seção de dados.');
    else {
      CP.storage.STORES.forEach((s) => {
        const arr = obj.data[s];
        if (arr === undefined) return;
        if (!Array.isArray(arr)) { errors.push(`A seção "${s}" deveria ser uma lista.`); return; }
        arr.forEach((r, i) => { if (!r || typeof r !== 'object' || typeof r.id !== 'string' || !r.id) errors.push(`Registro ${i + 1} de "${s}" sem identificador válido.`); });
        counts[s] = arr.length; total += arr.length;
      });
    }
    if (obj.settings !== undefined && (typeof obj.settings !== 'object' || obj.settings === null)) errors.push('As configurações do backup são inválidas.');
    return { ok: errors.length === 0, errors: errors.slice(0, 6), counts, total };
  };

  B.import = async (obj) => {
    const data = {};
    CP.storage.STORES.forEach((s) => { data[s] = obj.data[s] || []; });
    await CP.storage.replaceAll(data);
    CP.db.reset(data);
    if (obj.settings && typeof obj.settings === 'object') CP.settings.replace(obj.settings);
    CP.settings.save({ seeded: true });
  };

  B.clear = async () => {
    await CP.storage.clearAll();
    CP.db.reset();
    CP.settings.save({ seeded: true });
  };
})();

    refresh: '<path d="M20 11a8 8 0 0 0-14-4M4 5v4h4M4 13a8 8 0 0 0 14 4M20 19v-4h-4"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  };
  UI.icon = (n, size = 20) => `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

  /* ---------- Toast ---------- */
  UI.toast = (msg, type = 'ok') => {
    const root = document.getElementById('toastRoot');
    if (!root) return;
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.setAttribute('role', 'status');
    el.innerHTML = `${UI.icon(type === 'err' ? 'alert' : 'check', 18)}<span>${esc(msg)}</span>`;
    root.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, type === 'err' ? 4600 : 3000);
  };

  /* ---------- Modal ---------- */
  const stack = [];
  UI.modal = ({ title, body, footer, wide, onClose }) => {
    const root = document.getElementById('modalRoot');
    const wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Fechar">${UI.icon('x')}</button></div>
      <div class="modal-body"></div>${footer ? '<div class="modal-foot"></div>' : ''}</div>`;
    const bodyEl = wrap.querySelector('.modal-body');
    if (typeof body === 'string') bodyEl.innerHTML = body; else if (body) bodyEl.appendChild(body);
    let closed = false;
    const api = {
      el: wrap, body: bodyEl, foot: wrap.querySelector('.modal-foot'),
      close() {
        if (closed) return; closed = true;
        const i = stack.indexOf(api); if (i >= 0) stack.splice(i, 1);
        wrap.classList.remove('show');
        setTimeout(() => wrap.remove(), 160);
        if (onClose) onClose();
      },
    };
    wrap.addEventListener('mousedown', (e) => { if (e.target === wrap) api.close(); });
    wrap.querySelector('[data-close]').addEventListener('click', api.close);
    root.appendChild(wrap);
    stack.push(api);
    requestAnimationFrame(() => wrap.classList.add('show'));
    return api;
  };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && stack.length) stack[stack.length - 1].close(); });

  UI.confirm = ({ title = 'Confirmar', message, confirmText = 'Confirmar', cancelText = 'Cancelar', danger = false }) =>
    new Promise((res) => {
      const m = UI.modal({ title, body: `<p class="confirm-msg">${message}</p>`, footer: true, onClose: () => res(false) });
      m.foot.innerHTML = `<button class="btn ghost" data-no>${esc(cancelText)}</button><button class="btn ${danger ? 'danger-solid' : 'primary'}" data-yes>${esc(confirmText)}</button>`;
      m.foot.querySelector('[data-no]').onclick = () => m.close();
      m.foot.querySelector('[data-yes]').onclick = () => { res(true); m.close(); };
    });

  /* ---------- Formulário a partir de um esquema ---------- */
  function fieldHtml(f, v) {
    if (f.type === 'section') return `<h4 class="form-section span2">${esc(f.label)}</h4>`;
    const id = 'f_' + f.key;
    const span = f.full || f.type === 'textarea' || f.type === 'image' ? 'span2' : '';
    const req = f.required ? ' <span class="req" aria-hidden="true">*</span>' : '';
    let input = '';
    switch (f.type) {
      case 'select':
        input = `<select name="${f.key}" id="${id}">${(f.options || []).map((o) => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(v == null ? '' : v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
        break;
      case 'textarea':
        input = `<textarea name="${f.key}" id="${id}" rows="${f.rows || 3}" placeholder="${esc(f.placeholder || '')}">${esc(v == null ? '' : v)}</textarea>`;
        break;
      case 'checkbox':
        return `<div class="field span2" data-key="${f.key}"><label class="check"><input type="checkbox" name="${f.key}" id="${id}" ${v ? 'checked' : ''}><span>${esc(f.label)}</span></label></div>`;
      case 'image':
        input = `<div class="img-field"><img class="img-prev" alt="" ${v ? `src="${esc(v)}"` : 'hidden'}><div class="img-actions"><input type="file" accept="image/*" data-img="${f.key}" id="${id}"><button type="button" class="btn ghost sm" data-img-clear="${f.key}">Remover imagem</button></div></div>`;
        break;
      case 'money':
      case 'number':
        input = `<input type="number" inputmode="decimal" step="${f.type === 'money' ? '0.01' : f.step || '1'}" min="${f.min != null ? f.min : 0}" ${f.max != null ? `max="${f.max}"` : ''} name="${f.key}" id="${id}" value="${v == null ? '' : esc(v)}" placeholder="${esc(f.placeholder || (f.type === 'money' ? '0,00' : ''))}">`;
        break;
      default:
        input = `<input type="${f.type || 'text'}" name="${f.key}" id="${id}" value="${esc(v == null ? '' : v)}" placeholder="${esc(f.placeholder || '')}" ${f.readonly ? 'readonly' : ''} autocomplete="off">`;
    }
    return `<div class="field ${span}" data-key="${f.key}"><label for="${id}">${esc(f.label)}${req}</label>${input}${f.hint ? `<small>${esc(f.hint)}</small>` : ''}</div>`;
  }

  UI.form = ({ title, fields, values = {}, submitText = 'Salvar', notice, wide, onSubmit, onChange, extraButtons = [] }) => {
    const images = {};
    fields.forEach((f) => { if (f.type === 'image') images[f.key] = values[f.key] || ''; });
    const m = UI.modal({
      title, wide, footer: true,
      body: `<form class="form-grid" novalidate>${notice ? `<div class="notice span2">${notice}</div>` : ''}${fields.map((f) => fieldHtml(f, values[f.key])).join('')}<div class="form-error span2" role="alert" hidden></div></form>`,
    });
    m.foot.innerHTML = `${extraButtons.map((b, i) => `<button type="button" class="btn ${b.cls || 'ghost'}" data-extra="${i}">${esc(b.label)}</button>`).join('')}<span class="spacer"></span><button type="button" class="btn ghost" data-cancel>Cancelar</button><button type="button" class="btn primary" data-save>${esc(submitText)}</button>`;
    const form = m.body.querySelector('form');
    const errBox = form.querySelector('.form-error');
    const el = (k) => form.querySelector(`[name="${k}"]`);
    const read = () => {
      const out = {};
      fields.forEach((f) => {
        if (f.type === 'section') return;
        if (f.type === 'image') { out[f.key] = images[f.key] || ''; return; }
        const e = el(f.key); if (!e) return;
        if (f.type === 'checkbox') out[f.key] = e.checked;
        else if (f.type === 'number' || f.type === 'money') out[f.key] = e.value === '' ? null : Number(e.value);
        else out[f.key] = typeof e.value === 'string' ? e.value.trim() : e.value;
      });
      return out;
    };
    const set = (k, v) => { const e = el(k); if (!e) return; if (e.type === 'checkbox') e.checked = !!v; else e.value = v == null ? '' : v; };
    const updateVis = () => {
      const vals = read();
      fields.forEach((f) => { if (f.showIf) { const w = form.querySelector(`[data-key="${f.key}"]`); if (w) w.hidden = !f.showIf(vals); } });
    };
    const handle = (ev) => { const k = ev.target && ev.target.name; if (onChange && k) onChange(k, read(), set); updateVis(); };
    form.addEventListener('input', handle);
    form.addEventListener('change', handle);
    updateVis();

    form.addEventListener('change', async (ev) => {
      const t = ev.target;
      if (t.dataset && t.dataset.img) {
        const k = t.dataset.img;
        if (!t.files || !t.files[0]) return;
        try { images[k] = await U.resizeImage(t.files[0], 1000); const p = t.closest('.img-field').querySelector('.img-prev'); p.src = images[k]; p.hidden = false; }
        catch (e) { UI.toast(e.message, 'err'); }
      }
    });
    form.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-img-clear]');
      if (!b) return;
      images[b.dataset.imgClear] = '';
      const w = b.closest('.img-field'); w.querySelector('.img-prev').hidden = true; w.querySelector('input[type=file]').value = '';
    });

    const showErr = (msg) => { errBox.textContent = msg; errBox.hidden = false; };
    let busy = false;
    const submit = async () => {
      if (busy) return;
      errBox.hidden = true;
      const vals = read();
      for (const f of fields) {
        if (!f.required || f.type === 'section') continue;
        const w = form.querySelector(`[data-key="${f.key}"]`);
        if (w && w.hidden) continue;
        const v = vals[f.key];
        if (v === '' || v == null) { showErr(`Preencha o campo “${f.label}”.`); const e = el(f.key); if (e && e.focus) e.focus(); return; }
      }
      busy = true;
      const btn = m.foot.querySelector('[data-save]'); btn.disabled = true;
      try { await onSubmit(vals); m.close(); }
      catch (err) { console.warn(err); showErr(err && err.message ? err.message : 'Não foi possível salvar. Tente novamente.'); }
      finally { busy = false; btn.disabled = false; }
    };
    form.addEventListener('submit', (e) => { e.preventDefault(); submit(); });
    m.foot.querySelector('[data-save]').onclick = submit;
    m.foot.querySelector('[data-cancel]').onclick = () => m.close();
    m.foot.querySelectorAll('[data-extra]').forEach((b) => { b.onclick = () => extraButtons[Number(b.dataset.extra)].onClick(m); });
    m.form = form; m.read = read; m.set = set;
    const first = form.querySelector('input:not([type=file]):not([type=checkbox]), select, textarea');
    if (first && window.innerWidth > 900) setTimeout(() => first.focus(), 60);
    return m;
  };

  /* ---------- Blocos visuais ---------- */
  UI.badge = (text, kind = 'neutral') => `<span class="badge ${kind}">${esc(text)}</span>`;
  const KINDS = {
    pago: 'ok', pendente: 'warn', parcial: 'warn', estornado: 'bad', realizada: 'ok', agendada: 'rose', cancelada: 'bad', remarcada: 'warn',
    ativa: 'ok', nova: 'rose', inativa: 'neutral', antiga: 'neutral', ativo: 'ok', inativo: 'neutral', concluida: 'ok', andamento: 'rose', pausada: 'neutral',
    contatado: 'ok', encerrado: 'neutral', reembolsado: 'bad', novo: 'rose', conversando: 'rose', agendou: 'rose', realizou: 'ok', fechou: 'ok',
    semresposta: 'neutral', nao_fechou: 'bad', depois: 'warn', sim: 'ok', nao: 'warn',
  };
  UI.sb = (val, label) => UI.badge(label || val || '—', KINDS[val] || 'neutral');
  UI.labelOf = (list, v) => { const f = list.find((x) => x[0] === v); return f ? f[1] : v || '—'; };

  UI.empty = ({ icon = 'heart', title, text, action }) =>
    `<div class="empty"><div class="empty-ic">${UI.icon(icon, 28)}</div><h4>${esc(title)}</h4>${text ? `<p>${esc(text)}</p>` : ''}${action || ''}</div>`;

  UI.table = (cols, rows) => `<div class="table-wrap"><table class="tbl"><thead><tr>${cols.map((c) => `<th class="${c.cls || ''}">${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td data-label="${esc(c.label)}" class="${c.cls || ''}">${c.render(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  UI.actions = (list) => `<div class="row-actions">${list.map((a) => `<button class="icon-btn ${a.danger ? 'danger' : ''}" data-act="${a.act}" data-id="${esc(a.id)}" title="${esc(a.label)}" aria-label="${esc(a.label)}">${UI.icon(a.icon, 17)}</button>`).join('')}</div>`;

  UI.delegate = (root, handler) => root.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (b && root.contains(b)) handler(b.dataset.act, b.dataset.id, b, e);
  });

  UI.pageHead = (title, sub, actions) => `<div class="page-head"><div><h1>${esc(title)}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div><div class="head-actions">${actions || ''}</div></div>`;
  UI.tabs = (items, active) => `<div class="tabs" role="tablist">${items.map(([k, l, c]) => `<button class="tab ${k === active ? 'on' : ''}" role="tab" data-tab="${k}">${esc(l)}${c != null ? ` <em>${c}</em>` : ''}</button>`).join('')}</div>`;
  UI.bindTabs = (root, cb) => root.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => cb(b.dataset.tab)));
  UI.stat = ({ label, value, sub, extra, tone }) => `<div class="stat ${tone || ''}"><span class="stat-l">${esc(label)}</span><strong class="stat-v">${value}</strong>${sub ? `<span class="stat-s">${sub}</span>` : ''}${extra || ''}</div>`;
  UI.progress = (pct) => `<div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.max(0, Math.min(100, pct))}%"></span></div>`;
  UI.monthNav = (month, id = '') => `<div class="month-nav" ${id ? `id="${id}"` : ''}><button class="icon-btn" data-nav="-1" aria-label="Mês anterior">${UI.icon('chevL')}</button><strong>${esc(U.monthLabel(month))}</strong><button class="icon-btn" data-nav="1" aria-label="Próximo mês">${UI.icon('chevR')}</button></div>`;

  UI.filters = (defs, state) => `<div class="filters">${defs.map((d) => {
    const v = state[d.key] == null ? '' : state[d.key];
    if (d.type === 'search') return `<div class="f search">${UI.icon('search', 16)}<input type="search" data-f="${d.key}" placeholder="${esc(d.label)}" value="${esc(v)}"></div>`;
    if (d.type === 'month') return `<label class="f"><span>${esc(d.label)}</span><input type="month" data-f="${d.key}" value="${esc(v)}"></label>`;
    return `<label class="f"><span>${esc(d.label)}</span><select data-f="${d.key}">${d.options.map(([val, lab]) => `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`).join('')}</select></label>`;
  }).join('')}</div>`;
  UI.bindFilters = (root, state, cb) => root.querySelectorAll('[data-f]').forEach((el) => {
    el.addEventListener(el.type === 'search' ? 'input' : 'change', () => { state[el.dataset.f] = el.value; cb(); });
  });

  UI.opts = {
    patients: (blank) => [['', blank || '— selecione —'], ...U.sortBy(CP.patients.all(), (p) => U.norm(p.name)).map((p) => [p.id, p.name])],
    years: () => {
      const ys = new Set([U.today().slice(0, 4)]);
      ['payments', 'expenses', 'sales', 'sessions'].forEach((k) => CP[k].all().forEach((r) => { if (r.date) ys.add(U.yearOf(r.date)); }));
      return [...ys].sort().reverse();
    },
    list: (list, blank) => (blank ? [['', blank], ...list] : list),
  };

  UI.print = (html) => {
    const pa = document.getElementById('printArea');
    pa.innerHTML = html;
    document.body.classList.add('printing');
    const done = () => { document.body.classList.remove('printing'); pa.innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => { try { window.print(); } catch (e) { done(); } }, 60);
  };
})();

  <script>
/* Dashboard "Meu Consultório" */
(function () {
  'use strict';
  const CP = window.CP, U = CP.U, UI = CP.UI, esc = U.esc, F = CP.finance;
  let month = U.thisMonth();

  /* Só compara com o mês anterior quando existe dado para comparar */
  const delta = (cur, prev, ok, goodUp = true) => {
    if (!ok || !prev) return '';
    const pct = ((cur - prev) / Math.abs(prev)) * 100;
    if (!isFinite(pct)) return '';
    const up = pct >= 0;
    return `<span class="delta ${up === goodUp ? 'good' : 'bad'}">${up ? '▲' : '▼'} ${Math.abs(pct).toFixed(0)}% vs mês anterior</span>`;
  };

  CP.views.dashboard = {
    render(root) {
      const cur = F.monthSummary(month), prev = F.monthSummary(U.addMonths(month, -1)), hp = prev.hasData;
      const first = (CP.settings.get('name') || '').split(' ')[0];
      const active = CP.patients.all().filter((p) => p.status === 'ativa').length;
      const goal = Number(CP.settings.get('monthlyGoal')) || 0;
      const due = CP.followups.dueToday();
      const today = U.today();
      const upcoming = U.sortBy(CP.sessions.all().filter((s) => s.status === 'agendada' && s.date >= today), (s) => s.date + (s.time || '')).slice(0, 5);
      const pend = U.sortBy(cur.pendingPayments, (p) => p.date).slice(0, 5);
      const noReceipt = CP.payments.awaitingReceipt().length, noCarne = CP.payments.awaitingCarne().length;
      const last = CP.settings.get('lastBackup');
      const hasData = CP.payments.all().length + CP.patients.all().length > 0;
      const oldBackup = hasData && (!last || (Date.now() - new Date(last).getTime()) / 864e5 > 14);

      const alerts = [];
      if (due.count) alerts.push(['bell', `Você possui ${due.count} contato${due.count > 1 ? 's' : ''} para acompanhar hoje.`, 'followup']);
      if (noReceipt) alerts.push(['receipt', `${noReceipt} pagamento${noReceipt > 1 ? 's' : ''} pago${noReceipt > 1 ? 's' : ''} sem recibo emitido.`, 'recibos']);
      if (noCarne) alerts.push(['wallet', `${noCarne} pagamento${noCarne > 1 ? 's' : ''} aguardando registro no Carnê-Leão.`, 'recibos:carne']);
      if (oldBackup) alerts.push(['download', last ? 'Faz mais de 14 dias desde o último backup. Exporte um novo backup.' : 'Você ainda não exportou nenhum backup. Seus dados ficam apenas neste navegador.', 'configuracoes']);

      root.innerHTML = `<div class="hero-head"><div><h1>Meu Consultório</h1><p class="hello">Olá${first ? ', ' + esc(first) : ''} 🌷</p></div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${UI.monthNav(month)}${month !== U.thisMonth() ? '<button class="btn ghost sm" data-today>Mês atual</button>' : ''}</div></div>
        ${alerts.length ? `<div class="alerts">${alerts.map(([i, t, g]) => `<button class="alert" data-go="${g}">${UI.icon(i, 20)}<span>${esc(t)}</span></button>`).join('')}</div>` : ''}
        <div class="grid g-stats">
          ${UI.stat({ label: 'Receita recebida', value: U.money(cur.received), sub: 'Somente pagamentos pagos', extra: delta(cur.received, prev.received, hp), tone: 'hero' })}
          ${UI.stat({ label: 'Receita prevista', value: U.money(cur.expected), sub: 'Valores esperados do mês', extra: delta(cur.expected, prev.expected, hp) })}
          ${UI.stat({ label: 'A receber', value: U.money(cur.toReceive), sub: 'Previsto − recebido' })}
          ${UI.stat({ label: 'Despesas', value: U.money(cur.expensesPaid), sub: cur.expensesPending ? `${U.money(cur.expensesPending)} ainda pendentes` : 'Somente despesas pagas', extra: delta(cur.expensesPaid, prev.expensesPaid, hp, false) })}

  <script>
/* Pacientes: lista por status, detalhe e formulário */
(function () {
  'use strict';
  const CP = window.CP, U = CP.U, UI = CP.UI, esc = U.esc, P = CP.patients, A = CP.actions;
  let tab = 'ativa', q = '';

  function patientForm(p) {
    UI.form({
      title: p ? 'Editar paciente' : 'Nova paciente', wide: true, notice: P.NOTICE,
      values: p || { status: 'ativa' }, submitText: p ? 'Salvar alterações' : 'Cadastrar paciente',
      fields: P.fields(),
      extraButtons: p ? [{ label: 'Excluir', cls: 'danger', onClick: (m) => { m.close(); A.deletePatient(p.id); } }] : [],
      onSubmit: async (v) => {
        const rec = { ...(p || {}), ...v };
        if (rec.paymentModel !== 'pacote_mensal') rec.packageSize = null;
        const saved = await P.save(rec);
        // mantém o nome atualizado nos registros antigos (cópia do nome)
        if (p && p.name !== saved.name) {
          for (const x of CP.payments.forPatient(p.id)) await CP.payments.save({ ...x, patientName: saved.name });
          for (const x of CP.sessions.forPatient(p.id)) await CP.sessions.save({ ...x, patientName: saved.name });
        }
        UI.toast(p ? 'Paciente atualizada.' : 'Paciente cadastrada.');
        CP.App.refresh();
      },
    });
  }
  A.newPatient = (prefill) => patientForm(prefill ? { status: 'ativa', ...prefill } : null);
  A.editPatient = (id) => { const p = P.get(id); if (p) patientForm(p); };
  A.deletePatient = async (id) => {
    const p = P.get(id); if (!p) return;
    const ok = await UI.confirm({ title: 'Excluir paciente', message: `Excluir <strong>${esc(p.name)}</strong>? Os pagamentos e sessões já registrados continuam no histórico, com o nome dela.`, confirmText: 'Excluir paciente', danger: true });

    await P.remove(id);

      <p>${p.sessionValue ? U.money(p.sessionValue) + ' por sessão' : 'Valor da sessão não informado'}${p.paymentModel ? ' · ' + esc(model) : ''}</p>
      <p>Próximo atendimento: ${st.nextSession ? U.fmtDate(st.nextSession) : '—'}</p>

      `<div class="filters">${UI.filters([{ key: 'q', label: 'Buscar por nome, telefone ou e-mail', type: 'search' }], { q })}</div><div id="list"></div>`;
    const draw = () => {
      const box = root.querySelector('#list');
      if (tab === 'leads') {

          : UI.empty({ icon: 'userplus', title: 'Nenhum lead ainda', text: 'Registre novos contatos no módulo Leads.', action: '<a class="btn soft" href="#/leads">Ir para Leads</a>' });

    root.querySelector('#newP').onclick = () => A.newPatient();
    root.querySelector('#list').addEventListener('click', (e) => {
      const o = e.target.closest('[data-open]'); if (o) return CP.App.go('pacientes', o.dataset.open);

  }

  function detail(root, id) {
    const p = P.get(id);
    if (!p) { CP.App.go('pacientes'); return; }
    const month = U.thisMonth(), year = month.slice(0, 4);
    const st = P.stats(id, month), tot = CP.payments.totals(id, month, year);
    const row = (l, v) => `<div><dt>${esc(l)}</dt><dd>${v || '—'}</dd></div>`;
    root.innerHTML = `<a class="back" href="#/pacientes">${UI.icon('chevL', 18)} Pacientes</a>` +
      UI.pageHead(p.name, UI.sb(p.status, UI.labelOf(P.STATUS, p.status)),
        `<button class="btn soft" data-d="pay">${UI.icon('wallet', 18)} Pagamento</button><button class="btn soft" data-d="ses">${UI.icon('calendar', 18)} Sessão</button><button class="btn ghost" data-d="edit">${UI.icon('edit', 18)} Editar</button><button class="btn danger" data-d="del">${UI.icon('trash', 18)} Excluir</button>`) +
      `<div class="grid g-stats">
        ${UI.stat({ label: 'Recebido no mês', value: U.money(tot.month), sub: `${tot.countMonth} pagamento(s)` })}
        ${UI.stat({ label: 'Recebido no ano', value: U.money(tot.year), sub: `${tot.count} pagamento(s) no total` })}
        ${UI.stat({ label: 'Valor pendente', value: U.money(st.pendingValue), sub: `${st.pendingCount} pendente(s)`, tone: st.pendingValue > 0 ? 'neg' : '' })}
       </div>
       <section class="card section"><h3>Dados administrativos</h3><dl class="info-grid">
        ${row('Data da avaliação', U.fmtDate(p.evaluationDate) !== '—' ? U.fmtDate(p.evaluationDate) : '')}
        ${row('Valor da avaliação', p.evaluationValue ? U.money(p.evaluationValue) : '')}
        ${row('Data de início', U.fmtDate(p.startDate) !== '—' ? U.fmtDate(p.startDate) : '')}
        ${row('Valor da sessão', p.sessionValue ? U.money(p.sessionValue) : '')}
        ${row('Modalidade de cobrança', p.paymentModel ? esc(UI.labelOf(P.MODEL, p.paymentModel)) : '')}
        ${row('Forma de pagamento', p.paymentMethod ? esc(UI.labelOf(CP.payments.METHODS, p.paymentMethod)) : '')}
        ${row('Frequência', p.frequency ? esc(UI.labelOf(P.FREQ, p.frequency)) : '')}
        ${row('Sessões do pacote', p.packageSize)}
        ${row('Dia da sessão', esc(p.sessionDay || ''))}
        ${row('Horário', esc(p.sessionTime || ''))}
        ${row('Telefone', esc(p.phone || ''))}
        ${row('E-mail', esc(p.email || ''))}
        ${row('Último atendimento', st.lastSession ? U.fmtDate(st.lastSession) : '')}
        ${row('Próximo atendimento', st.nextSession ? U.fmtDate(st.nextSession) : '')}
        ${row('Último pagamento', st.lastPayment ? U.fmtDate(st.lastPayment) : '')}
        ${row('Próximo pagamento', st.nextPayment ? U.fmtDate(st.nextPayment) : '')}
        ${p.exitDate ? row('Data de saída', U.fmtDate(p.exitDate)) : ''}
       </dl>${p.notes ? `<p style="margin-top:18px"><strong style="color:var(--wine)">Observações administrativas</strong><br>${esc(p.notes)}</p>` : ''}
       <div class="notice big">${esc(P.NOTICE)}</div></section>
       ${p.paymentModel === 'pacote_mensal' ? '<section class="card section" id="pkgBox"></section>' : ''}
       <section class="card section"><div class="card-head"><h3>Pagamentos</h3></div><div id="payBox"></div></section>
       <section class="card section"><div class="card-head"><h3>Sessões registradas</h3></div><div id="sesBox"></div></section>`;
    if (p.paymentModel === 'pacote_mensal') CP.pkgUI.mount(root.querySelector('#pkgBox'), id);
    const pays = U.sortBy(CP.payments.forPatient(id), (x) => x.date, -1);
    root.querySelector('#payBox').innerHTML = pays.length ? CP.payUI.table(pays, { hidePatient: true }) : UI.empty({ icon: 'wallet', title: 'Nenhum pagamento registrado', text: 'Os pagamentos desta paciente aparecerão aqui.' });
    const ses = U.sortBy(CP.sessions.forPatient(id), (x) => x.date, -1);
    root.querySelector('#sesBox').innerHTML = ses.length ? CP.sesUI.table(ses, { hidePatient: true }) : UI.empty({ icon: 'calendar', title: 'Nenhuma sessão registrada', text: 'Registre sessões para acompanhar presença e pacotes.' });
    CP.payUI.bind(root.querySelector('#payBox')); CP.sesUI.bind(root.querySelector('#sesBox'));
    const d = (k) => root.querySelector(`[data-d="${k}"]`);
    d('pay').onclick = () => A.newPayment({ patientId: id, paymentMethod: p.paymentMethod, method: p.paymentMethod || 'pix' });
    d('ses').onclick = () => A.newSession({ patientId: id, time: p.sessionTime || '' });
    d('edit').onclick = () => A.editPatient(id);
    d('del').onclick = () => A.deletePatient(id);
  }

  CP.views.pacientes = { render(root, id) { if (id) detail(root, id); else list(root); } };

/* Tela de pagamentos + componentes reutilizáveis (payUI) */
(function () {
  'use strict';
  const CP = window.CP, U = CP.U, UI = CP.UI, esc = U.esc, Pay = CP.payments, A = CP.actions;
  const nm = CP.patients.name;

  /* ---------- Formulário ---------- */
  function paymentForm(p, prefill) {
    const vals = p ? { ...p, refMonth: p.refMonth || U.monthKey(p.date) } : { date: U.today(), status: 'pago', refType: 'sessao', method: 'pix', ...prefill };
    if (!vals.refMonth) vals.refMonth = U.monthKey(vals.date);
    let auto = null;
    if (!p && vals.patientId && vals.value == null) { const d = Pay.defaultValue(vals.patientId, vals.refType); if (d != null) { vals.value = d; auto = d; } }
    UI.form({
      title: p ? 'Editar pagamento' : 'Registrar pagamento', values: vals, submitText: p ? 'Salvar alterações' : 'Registrar pagamento', wide: true,
      fields: [
        { key: 'patientId', label: 'Paciente', type: 'select', options: UI.opts.patients('— sem paciente —') },
        { key: 'value', label: 'Valor (R$)', type: 'money', required: true },
        { key: 'date', label: 'Data', type: 'date', required: true },
        { key: 'refType', label: 'Referente a', type: 'select', options: Pay.REF },
        { key: 'refMonth', label: 'Mês do pacote', type: 'month', showIf: (v) => v.refType === 'pacote' },
        { key: 'method', label: 'Forma de pagamento', type: 'select', options: Pay.METHODS },
        { key: 'status', label: 'Status', type: 'select', options: Pay.STATUS, hint: 'Só pagamentos “pagos” entram na receita recebida.' },
        { type: 'section', label: 'Recibo e Carnê-Leão' },
        { key: 'receiptIssued', label: 'Recibo emitido?', type: 'checkbox' },
        { key: 'receiptDate', label: 'Data do recibo', type: 'date', showIf: (v) => v.receiptIssued },
        { key: 'carneLeao', label: 'Carnê-Leão registrado?', type: 'checkbox' },
        { key: 'carneDate', label: 'Data do registro', type: 'date', showIf: (v) => v.carneLeao },
        { key: 'note', label: 'Observações', type: 'textarea' },
      ],
      onChange: (key, v, set) => {
        if (key === 'patientId' || key === 'refType') {
          const d = Pay.defaultValue(v.patientId, v.refType);
          if (d != null && (v.value == null || v.value === auto)) { set('value', d); auto = d; }
        }
      },
      extraButtons: p ? [{ label: 'Excluir', cls: 'danger', onClick: async (m) => { m.close(); A.deletePayment(p.id); } }] : [],
      onSubmit: async (v) => {
        const pat = v.patientId ? CP.patients.get(v.patientId) : null;
        const rec = {
          ...(p || {}), ...v, value: Number(v.value) || 0,
          patientName: pat ? pat.name : (p && p.patientId === v.patientId ? p.patientName : ''),
          refMonth: v.refType === 'pacote' ? v.refMonth || U.monthKey(v.date) : '',
          receiptDate: v.receiptIssued ? v.receiptDate || U.today() : '',
          carneDate: v.carneLeao ? v.carneDate || U.today() : '',
        };
        if (!(rec.value > 0)) throw new Error('Informe um valor maior que zero.');
        await Pay.save(rec);
        UI.toast(p ? 'Pagamento atualizado.' : 'Pagamento registrado com sucesso.');
        CP.App.refresh();
      },
    });
  }
  A.newPayment = (prefill) => paymentForm(null, prefill || {});
  A.editPayment = (id) => { const p = Pay.get(id); if (p) paymentForm(p); };
  A.deletePayment = async (id) => {
    const ok = await UI.confirm({ title: 'Excluir pagamento', message: 'Excluir este pagamento do histórico? Esta ação não pode ser desfeita.', confirmText: 'Excluir', danger: true });
    if (!ok) return;
    await Pay.remove(id); UI.toast('Pagamento excluído.'); CP.App.refresh();
  };

  /* ---------- Tabela reutilizável ---------- */
  CP.payUI = {
    table(rows, opts = {}) {
      const cols = [
        { label: 'Data', render: (p) => U.fmtDate(p.date) },
        ...(opts.hidePatient ? [] : [{ label: 'Paciente', render: (p) => `<strong>${esc(nm(p.patientId, p.patientName))}</strong>` }]),
        { label: 'Referente', render: (p) => esc(UI.labelOf(Pay.REF, p.refType)) + (p.refType === 'pacote' && p.refMonth ? `<br><small>${esc(U.monthLabel(p.refMonth))}</small>` : '') },
        { label: 'Forma', render: (p) => esc(UI.labelOf(Pay.METHODS, p.method)) },
        { label: 'Valor', cls: 'num', render: (p) => `<strong>${U.money(p.value)}</strong>` },
        { label: 'Status', render: (p) => UI.sb(p.status, UI.labelOf(Pay.STATUS, p.status)) },
        { label: 'Recibo', render: (p) => UI.sb(p.receiptIssued ? 'sim' : 'nao', p.receiptIssued ? 'Sim' : 'Não') },
        { label: 'Carnê-Leão', render: (p) => UI.sb(p.carneLeao ? 'sim' : 'nao', p.carneLeao ? 'Sim' : 'Não') },
        { label: '', cls: 'act', render: (p) => UI.actions([
          ...(p.status === 'pago' ? [{ act: 'pay-receipt', id: p.id, icon: 'receipt', label: 'Gerar recibo' }] : []),
          { act: 'pay-edit', id: p.id, icon: 'edit', label: 'Editar' },
          { act: 'pay-del', id: p.id, icon: 'trash', label: 'Excluir', danger: true },
        ]) },
      ];
      return UI.table(cols, rows);
    },
    bind(root) {
      UI.delegate(root, (act, id) => {
        if (act === 'pay-edit') A.editPayment(id);
        else if (act === 'pay-del') A.deletePayment(id);
        else if (act === 'pay-receipt') A.issueReceipt(id);
      });
    },
  };

  /* ---------- Tela ---------- */
  const f = { month: U.thisMonth(), year: '', patient: '', status: '', method: '', receipt: '', carne: '' };
  const yn = [['', 'Todos'], ['sim', 'Sim'], ['nao', 'Não']];

  function filtered() {
    return U.sortBy(Pay.all().filter((p) => {
      if (f.month && U.monthKey(p.date) !== f.month) return false;
      if (!f.month && f.year && U.yearOf(p.date) !== f.year) return false;
      if (f.patient && p.patientId !== f.patient) return false;
      if (f.status && p.status !== f.status) return false;
      if (f.method && p.method !== f.method) return false;
      if (f.receipt && (f.receipt === 'sim') !== !!p.receiptIssued) return false;
      if (f.carne && (f.carne === 'sim') !== !!p.carneLeao) return false;
      return true;
    }), (p) => p.date + (p.createdAt || ''), -1);
  }

  CP.views.pagamentos = {
    render(root) {
      const weekly = CP.patients.all().filter((p) => ['semanal', 'quinzenal', 'por_sessao'].includes(p.paymentModel) && ['ativa', 'nova'].includes(p.status));
      const refMonth = f.month || U.thisMonth();
      const refYear = f.month ? f.month.slice(0, 4) : f.year || U.today().slice(0, 4);
      root.innerHTML = UI.pageHead('Pagamentos', 'Histórico completo de pagamentos recebidos e pendentes.', `<button class="btn primary" id="newPay">${UI.icon('plus', 18)} Registrar pagamento</button>`) +
        (weekly.length ? `<section class="card"><h3>Pagamentos semanais</h3><p class="sub" style="margin-top:-8px">Referência: ${esc(U.monthLabel(refMonth))} e ano ${refYear}.</p><div class="grid g-3">${weekly.map((p) => {
          const t = Pay.totals(p.id, refMonth, refYear);
          return `<div class="stat"><span class="stat-l">${esc(p.name)}${p.sessionValue ? ` · padrão ${U.money(p.sessionValue)}` : ''}</span><strong class="stat-v">${U.money(t.month)}</strong><span class="stat-s">no mês · ${t.countMonth} pagamento(s)</span><span class="stat-s">${U.money(t.year)} no ano · ${t.count} no total · ${t.pendingCount} pendente(s)</span></div>`;
        }).join('')}</div></section>` : '') +
        `<section class="card section">${UI.filters([
          { key: 'month', label: 'Mês', type: 'month' },
          { key: 'year', label: 'Ano', options: UI.opts.list(UI.opts.years().map((y) => [y, y]), 'Todos') },
          { key: 'patient', label: 'Paciente', options: UI.opts.patients('Todas') },
          { key: 'status', label: 'Status', options: UI.opts.list(Pay.STATUS, 'Todos') },
          { key: 'method', label: 'Forma de pagamento', options: UI.opts.list(Pay.METHODS, 'Todas') },
          { key: 'receipt', label: 'Recibo emitido', options: yn },
          { key: 'carne', label: 'Carnê-Leão', options: yn },
        ], f)}<div id="list"></div></section>`;
      const draw = () => {
        const rows = filtered();
        const paid = U.sum(rows.filter((p) => p.status === 'pago'), (p) => p.value);
        const pend = U.sum(rows.filter((p) => p.status === 'pendente' || p.status === 'parcial'), (p) => p.value);
        root.querySelector('#list').innerHTML = rows.length
          ? `<div class="sum-strip"><span>Recebido: <b>${U.money(paid)}</b></span><span>Pendente/parcial: <b>${U.money(pend)}</b></span><span>${rows.length} registro(s)</span></div>${CP.payUI.table(rows)}`
